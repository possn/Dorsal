# Faz uma leitura leve à base de dados todos os dias, para o projecto gratuito do Supabase não ser pausado por inactividade.
name: Manter Supabase activo
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ler configuração pública da app
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/config.js" -o config.js
          URL=$(grep -o 'supabaseUrl: *"[^"]*"' config.js | sed 's/.*"\(.*\)"/\1/')
          KEY=$(grep -o 'supabaseAnonKey: *"[^"]*"' config.js | sed 's/.*"\(.*\)"/\1/')
          echo "URL=$URL" >> "$GITHUB_ENV"
          echo "::add-mask::$KEY"
          echo "KEY=$KEY" >> "$GITHUB_ENV"
      - name: Consultar o calendário de provas
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/provas?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
            echo "Resposta $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
