name: Explorar fontes de provas (temporário)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - name: Descarregar páginas
        run: |
          mkdir -p paginas
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36 DorsalBot/1.0 (+https://possn.github.io/Dorsal/)"
          get(){ curl -sL -A "$UA" --max-time 40 -o "paginas/$1" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "$1 falhou"; sleep 2; }
          get tp_eventos.html "https://www.trilhoperdido.com/eventos"
          get tp_robots.txt "https://www.trilhoperdido.com/robots.txt"
          get tp_home.html "https://www.trilhoperdido.com/"
          get pr_trail.html "https://www.portugalrunning.com/trail/"
          get pr_robots.txt "https://www.portugalrunning.com/robots.txt"
          get gt_p1.html "https://gotrail.run/calendario-trail-running/portugal"
          get gt_p2.html "https://gotrail.run/calendario-trail-running/portugal?page=2"
          get gt_robots.txt "https://gotrail.run/robots.txt"
          get gt_sitemap.xml "https://gotrail.run/sitemap.xml"
          get tp_eventos2.html "https://www.trilhoperdido.com/eventos?page=2"
          get rl_p1.html "https://running.life/trail-running-calendar/portugal"
          get atrp.html "https://www.atrp.pt/calendario"
          get sg.html "https://stopandgo.net/events"
          get lap.html "https://lap2go.com/pt/event/list"
          ls -la paginas
      - name: Guardar no ramo fontes-exploracao
        run: |
          cd paginas
          git init -q -b fontes-exploracao
          git config user.name "dorsal-bot"; git config user.email "dorsal-bot@users.noreply.github.com"
          git add -A && git commit -qm "páginas $(date -u +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" fontes-exploracao
