name: Explorar fontes de provas (temporário)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - name: Descarregar páginas
        run: |
          mkdir -p paginas
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36 DorsalBot/1.0 (+https://possn.github.io/Dorsal/)"
          get(){ curl -sL -A "$UA" --max-time 40 -o "paginas/$1" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "$1 falhou"; sleep 2; }
          get pr_sitemap.xml "https://www.portugalrunning.com/sitemap_index.xml"
          get pr_ev.html "https://www.portugalrunning.com/eventos/trail-vitoriano/"
          get gt_ev.html "https://gotrail.run/pt/event/trail-do-zezere"
          get gt_p9.html "https://gotrail.run/calendario-trail-running/portugal?page=9"
          get gt_races.xml "https://gotrail.run/sitemap_gotrail-run-races-1.xml"
          get tp_ev.html "https://www.trilhoperdido.com/evento/vulcan-trail-2027"
          get rl_p2.html "https://running.life/trail-running-calendar/portugal?page=2"
          ls -la paginas
      - name: Guardar no ramo fontes-exploracao
        run: |
          cd paginas
          git init -q -b fontes-exploracao
          git config user.name "dorsal-bot"; git config user.email "dorsal-bot@users.noreply.github.com"
          git add -A && git commit -qm "páginas $(date -u +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" fontes-exploracao
