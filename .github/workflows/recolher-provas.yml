name: Recolher provas de trail
on:
  schedule:
    - cron: "23 4 * * 1"   # segundas, 04:23 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency: recolher-provas
jobs:
  recolher:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: recolha/cache_portugalrunning.json
          key: pr-cache-${{ github.run_id }}
          restore-keys: pr-cache-
      - name: Recolher
        run: |
          export SUPABASE_ANON_KEY=$(grep -o 'eyJ[A-Za-z0-9._-]*' config.js | head -1)
          python3 scripts/recolher_provas.py
      - name: Publicar no ramo recolha
        run: |
          mkdir -p /tmp/pub && cp recolha/provas.json /tmp/pub/ && cd /tmp/pub
          git init -q -b recolha
          git config user.name "dorsal-bot"; git config user.email "dorsal-bot@users.noreply.github.com"
          git add provas.json && git commit -qm "Recolha $(date -u +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" recolha
